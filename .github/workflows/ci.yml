name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# No AWS credentials anywhere in this workflow. Every check below runs against the
# configuration alone, which is what lets it run on pull requests from the first
# commit. A live apply is a separate, manual exercise against a scratch account.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The module itself needs only Terraform >= 1.6, but the tests use mock_provider
  # (1.7+) and strcontains (1.8+).
  TERRAFORM_VERSION: 1.13.3
  TFLINT_VERSION: v0.64.0
  TERRAFORM_DOCS_VERSION: v0.24.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Install terraform-docs
        run: |
          curl -sSLo terraform-docs.tar.gz \
            "https://terraform-docs.io/dl/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf terraform-docs.tar.gz terraform-docs
          install -m 0755 terraform-docs /usr/local/bin/terraform-docs
          rm -f terraform-docs terraform-docs.tar.gz

      - name: Formatting
        run: make fmt

      # Validates the root module and the example, so a variable renamed in one
      # and not the other fails here.
      - name: Validate
        run: make validate

      - name: Lint
        run: make lint

      # Fails if the generated input/output tables in the READMEs are stale. Those
      # tables are where a customer reads what each input does, so a missing one
      # is a documentation gap, not a formatting nit.
      - name: Docs are current
        run: make docs-check

      # Variable validations, a full mocked plan of the resource graph, and the
      # rendered chart values against their golden files.
      - name: Tests
        run: make test
