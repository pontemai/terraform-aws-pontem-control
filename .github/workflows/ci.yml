name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# No AWS credentials anywhere in this workflow. Every check below runs against the
# configuration alone, which is what lets it run on pull requests from the first
# commit. A live apply is a separate, manual exercise against a scratch account.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Run the minimum supported version so feature drift fails in CI.
  TERRAFORM_VERSION: 1.11.4
  TFLINT_VERSION: v0.64.0
  TERRAFORM_DOCS_VERSION: v0.24.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Install terraform-docs
        run: |
          archive="terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          checksums="terraform-docs-${TERRAFORM_DOCS_VERSION}.sha256sum"
          release="https://github.com/terraform-docs/terraform-docs/releases/download/${TERRAFORM_DOCS_VERSION}"
          curl -fsSLO "${release}/${archive}"
          curl -fsSLO "${release}/${checksums}"
          grep "  ${archive}$" "${checksums}" | sha256sum --check --strict
          tar -xzf "${archive}" terraform-docs
          install -m 0755 terraform-docs /usr/local/bin/terraform-docs

      - name: Formatting
        run: make fmt

      # Root module, example, and submodule, so a variable renamed in one and not
      # the other fails here.
      - name: Validate
        run: make validate

      - name: Lint
        run: make lint

      # Fails if the generated input/output tables in the READMEs are stale. Those
      # tables are where a customer reads what each input does, so a missing one
      # is a documentation gap, not a formatting nit.
      - name: Docs are current
        run: make docs-check

      # Variable validations, a full mocked plan of the resource graph, and the
      # chart_values submodule's rendering assertions.
      - name: Tests
        run: make test
