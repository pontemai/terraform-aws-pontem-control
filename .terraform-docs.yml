formatter: markdown table

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sections:
  hide:
    - header
    - footer
    - modules

sort:
  enabled: true
  by: required

settings:
  anchor: false
  color: true
  default: true
  description: true
  escape: true
  hide-empty: true
  html: true
  indent: 2
  # Show the provider constraint, not the version `terraform init` resolved:
  # the lock file is gitignored, so a resolved version goes stale on every
  # provider release and fails docs-check.
  lockfile: false
  required: true
  sensitive: true
  type: true
